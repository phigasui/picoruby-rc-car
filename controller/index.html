<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ラジコン コントローラー</title>
<style>
  :root {
    --bg: #fff8e7; --fg: #3a2e1f; --card: #ffffff;
    --pad: #4aa3ff; --pad-on: #1f6fd1; --stop: #ff5a5a; --dance: #ffb020;
    --ok: #2bb673; --muted: #9a8c78;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1a16; --fg: #f4ead8; --card: #2a2620;
      --pad: #3b86d9; --pad-on: #6fb2ff; --muted: #a89c88;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px; gap: 16px; user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  h1 { font-size: 28px; margin: 4px 0 0; }
  .status { font-size: 20px; color: var(--muted); min-height: 1.4em; text-align: center; }
  .status.on { color: var(--ok); font-weight: bold; }
  button { font-family: inherit; border: none; cursor: pointer; color: #fff; }
  #connect {
    font-size: 26px; padding: 14px 40px; border-radius: 999px; background: var(--ok);
    box-shadow: 0 4px 0 rgba(0,0,0,.2);
  }
  #connect.on { background: var(--muted); }
  .pad {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    width: 100%; aspect-ratio: 1;
  }
  .pad button {
    font-size: clamp(32px, 10vw, 56px); border-radius: 24px; background: var(--pad);
    box-shadow: 0 6px 0 rgba(0,0,0,.25); transition: transform .05s;
  }
  .pad button.on { background: var(--pad-on); transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .pad .stop { background: var(--stop); font-size: clamp(20px, 6vw, 30px); }
  .row { display: flex; gap: 10px; width: 100%; }
  .speed button {
    flex: 1; font-size: 22px; padding: 12px 0; border-radius: 16px;
    background: var(--card); color: var(--fg); border: 3px solid var(--muted);
  }
  .speed button.sel { border-color: var(--pad-on); background: var(--pad-on); color: #fff; }
  #dance {
    flex: 1; font-size: 30px; padding: 16px 0; border-radius: 20px; background: var(--dance);
    box-shadow: 0 6px 0 rgba(0,0,0,.25);
  }
  .controls { display: flex; flex-direction: column; align-items: center; gap: 16px; width: min(100%, 420px); }
  .disabled { opacity: .45; pointer-events: none; }
  .note { font-size: 14px; color: var(--muted); width: min(100%, 420px); text-align: center; margin: 0; }
</style>
</head>
<body>
  <h1>🚗 ラジコン</h1>
  <button id="connect">つなぐ</button>
  <div class="status" id="status">「つなぐ」を おしてね</div>

  <div id="controls" class="controls disabled">
    <div class="pad" id="pad">
      <button data-dir="fl">↖</button>
      <button data-dir="f">↑</button>
      <button data-dir="fr">↗</button>
      <button data-dir="l">←</button>
      <button data-dir="s" class="stop">とまる</button>
      <button data-dir="r">→</button>
      <button data-dir="bl">↙</button>
      <button data-dir="b">↓</button>
      <button data-dir="br">↘</button>
    </div>
    <div class="row speed" id="speed">
      <button data-speed="40">🐢 おそい</button>
      <button data-speed="70" class="sel">🐇 ふつう</button>
      <button data-speed="100">🚀 はやい</button>
    </div>
    <div class="row"><button id="dance">💃 おどる</button></div>
  </div>
  <p class="note">Android や パソコンの Chrome で ひらいてね（iPhone の Safari では うごきません）</p>

<script>
const NUS = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX  = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // くるまが受け取る側

// 方向ごとの [左, 右] (速さ 100 のとき)
const DIRS = {
  f: [100, 100], b: [-100, -100],
  l: [-70, 70],  r: [70, -70],
  fl: [40, 100], fr: [100, 40],
  bl: [-40, -100], br: [-100, -40],
  s: [0, 0],
};
const SEND_INTERVAL_MS = 150; // くるまのフェイルセーフ (500ms) より短く

let device = null, rx = null;
let speed = 70;
let current = null;      // 押している方向
let timer = null;
let writing = false, pending = null;

const $ = (id) => document.getElementById(id);
const status = (text, on = false) => { $("status").textContent = text; $("status").classList.toggle("on", on); };

async function send(cmd) {
  if (!rx) return;
  if (writing) { pending = cmd; return; } // 書き込み中は最新の 1 つだけ残す
  writing = true;
  try {
    await rx.writeValueWithoutResponse(new TextEncoder().encode(cmd + "\n"));
  } catch (e) {
    console.warn(e);
  } finally {
    writing = false;
    if (pending) { const p = pending; pending = null; send(p); }
  }
}

function driveCmd(dir) {
  const [l, r] = DIRS[dir];
  return dir === "s" ? "S" : `D ${Math.round(l * speed / 100)} ${Math.round(r * speed / 100)}`;
}

function press(dir) {
  current = dir;
  highlight();
  send(driveCmd(dir));
  clearInterval(timer);
  if (dir !== "s") timer = setInterval(() => send(driveCmd(current)), SEND_INTERVAL_MS);
}

function release() {
  if (current === null) return;
  current = null;
  clearInterval(timer);
  highlight();
  send("S");
}

function highlight() {
  document.querySelectorAll("#pad button").forEach((b) => b.classList.toggle("on", b.dataset.dir === current));
}

function setConnected(on) {
  $("controls").classList.toggle("disabled", !on);
  $("connect").classList.toggle("on", on);
  $("connect").textContent = on ? "きる" : "つなぐ";
}

async function connect() {
  if (!navigator.bluetooth) {
    status("この ブラウザは Bluetooth が つかえないよ。Chrome で ひらいてね");
    return;
  }
  if (device && device.gatt.connected) { device.gatt.disconnect(); return; }
  try {
    status("くるまを えらんでね…");
    device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: [NUS] });
    device.addEventListener("gattserverdisconnected", () => {
      rx = null; release(); setConnected(false); status("きれちゃった。もういちど「つなぐ」を おしてね");
    });
    status("つないでいるよ…");
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(NUS);
    rx = await service.getCharacteristic(RX);
    setConnected(true);
    status(`${device.name || "くるま"} と つながったよ！`, true);
  } catch (e) {
    console.warn(e);
    status("つなげなかったよ。くるまの でんげんを みてね");
  }
}

$("connect").addEventListener("click", connect);

document.querySelectorAll("#pad button").forEach((b) => {
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); b.setPointerCapture(e.pointerId); press(b.dataset.dir); });
  b.addEventListener("pointerup", release);
  b.addEventListener("pointercancel", release);
  b.addEventListener("contextmenu", (e) => e.preventDefault());
});

document.querySelectorAll("#speed button").forEach((b) => {
  b.addEventListener("click", () => {
    speed = Number(b.dataset.speed);
    document.querySelectorAll("#speed button").forEach((x) => x.classList.toggle("sel", x === b));
  });
});

$("dance").addEventListener("click", () => { release(); send("X"); });

// キーボード: やじるしキー (2 つ同時押しでななめ)、スペースでおどる
const keys = new Set();
function keyDir() {
  const v = (keys.has("ArrowUp") ? "f" : keys.has("ArrowDown") ? "b" : "");
  const h = (keys.has("ArrowLeft") ? "l" : keys.has("ArrowRight") ? "r" : "");
  return v + h || null;
}
addEventListener("keydown", (e) => {
  if (e.key === " ") { e.preventDefault(); if (!e.repeat) { release(); send("X"); } return; }
  if (!e.key.startsWith("Arrow")) return;
  e.preventDefault();
  keys.add(e.key);
  const d = keyDir();
  if (d && d !== current) press(d);
});
addEventListener("keyup", (e) => {
  if (!e.key.startsWith("Arrow")) return;
  keys.delete(e.key);
  const d = keyDir();
  if (d) press(d); else release();
});
addEventListener("blur", () => { keys.clear(); release(); });
</script>
</body>
</html>
